name: Deploy Staff Hub

on:
  push:
    branches: [main, staff-hub-app]
    paths: ["staff-hub/**", ".github/workflows/staff-hub.yml"]
  workflow_dispatch:

concurrency:
  group: staff-hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that Firebase is connected
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          VAPID: ${{ secrets.FIREBASE_VAPID_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          for pair in "FIREBASE_PROJECT_ID:$PROJECT" "FIREBASE_SERVICE_ACCOUNT:$SA" "FIREBASE_VAPID_KEY:$VAPID" "MAIL_USER:$MAIL_USER" "MAIL_APP_PASSWORD:$MAIL_PASS"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -n "$value" ]; then echo "found    $name"; else echo "MISSING  $name"; fi
          done
          if [ -n "$SA" ] && ! printf '%s' "$SA" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type")=="service_account"' 2>/dev/null; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT isn't the full key file. Paste the entire contents of the downloaded .json file, from the first { to the last }."
            exit 1
          fi
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then
            echo "::warning::Firebase isn't connected yet. Add the FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT repository secrets, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        if: steps.check.outputs.ready == 'true'
        env:
          VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          [ -n "$VAPID_KEY" ] || echo "::warning::FIREBASE_VAPID_KEY is not set, so push notifications will be off."
          cd web && npm ci --no-audit --no-fund && npm run build

      - name: Install server dependencies
        if: steps.check.outputs.ready == 'true'
        run: cd functions && npm ci --no-audit --no-fund --omit=dev

      - name: Configure server settings
        if: steps.check.outputs.ready == 'true'
        env:
          OWNERS: ${{ secrets.HUB_OWNER_EMAILS }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          {
            echo "OWNER_EMAILS=${OWNERS:-info@enchantedmedicalaesthetics.com}"
            echo "MAIL_USER=${MAIL_USER}"
            echo "MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD}"
          } > functions/.env
          [ -n "$MAIL_APP_PASSWORD" ] && echo "Email alerts: on" || echo "Email alerts: off (MAIL_USER / MAIL_APP_PASSWORD not set)"

      - name: Deploy to Firebase
        if: steps.check.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.34.1 deploy --project "$PROJECT" --non-interactive --force
          echo "### Staff Hub is live at https://$PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/sa.json"
